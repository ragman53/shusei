[package]
name = "shusei-tauri"
version = "0.4.0"
description = "Shusei Reading App - Tauri + Leptos"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shusei_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Leptos for frontend (CSR mode for Tauri)
leptos = { version = "0.7", default-features = false, features = ["csr"] }
leptos_dom = "0.7"
# Existing shusei crates (to be integrated)
# shusei-core = { path = "../src/core" }
# shusei-db = { path = "../src/db" }

